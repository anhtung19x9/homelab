zot:
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      external-dns.alpha.kubernetes.io/target: homelab-tunnel.19ninety-three.com
      external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    className: nginx
    hosts:
      - host: &host registry.19ninety-three.com
        paths:
          - path: /
    tls:
      - secretName: zot-tls-certificate
        hosts:
          - *host
  # TODO enable auth
  persistence: true
  pvc:
    create: true
    storage: 50Gi
